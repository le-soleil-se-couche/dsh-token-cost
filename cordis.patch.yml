# dsh-token-cost bundle patch: inserts the plugin row into the web profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field); install with
# `dsh plugin --profile web add link:/absolute/path/to/dsh-token-cost`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (usage ledger + /api/dsh-token-cost routes), and the
# `dsh.client` declaration in package.json makes the browser half (exports
# "./client", served at /plugins/token-cost/client.js) load in the web GUI.
- insert:
    - id: token-cost
      name: '@deepseek-ai/dsh-token-cost'
